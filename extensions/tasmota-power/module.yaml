name: tasmota-power
title: Connect Power Control
summary: Control and monitor smart plugs (Tasmota, Shelly Gen1/Gen2+, Zigbee2MQTT, ESPHome, OpenBeken, Generic MQTT, and Home Assistant) for printers via MQTT, Direct HTTP, or REST, with active-print power-off protection and auto-off after print.
codeowner: Pixelplanet
kind: sink
version: 0.5.7
license: MIT
contract_major: 1
openapi: openapi.json

require:
  core: ">=0.1.0-beta.1"
  core-device.get: "*"
  core-device.list: "*"
  core-device.jobs: "*"

permissions:
  - observe

# What the module asks the host about the person behind a request, before it
# changes anything: operate_resource on this extension and operate on the
# printer to switch a plug, configure_resource on this extension to change
# plugs and connections. It never takes these actions as itself.
checks:
  - operate
  - operate_resource
  - configure_resource

needs:
  data: true
  listen:
    - name: mqtt
      tcp: 1883
      why: the built-in MQTT broker your smart plugs connect to. It is used only while that broker is switched on.

options:
  - key: mqtt_host
    type: string
    summary: Leave empty. The MQTT broker is set on the Connections tab. A host written here overrides it, for a server set up from a configuration file.
  - key: http_host
    type: string
    summary: Leave empty. Each plug's address is set on the Plugs tab. A host written here is only suggested when a plug is set up.
  - key: ha_url
    type: url
    summary: Leave empty. Home Assistant is set on the Connections tab. A URL written here overrides it, for a server set up from a configuration file.

egress:
  - option: mqtt_host
    ports: [1883, 8883]
    from: process
    why: Reaches the MQTT broker set on the Connections tab or in mqtt_host. With the built-in broker, connects once to that address to check that plugs can reach it.
    sends: Power commands and state queries for the plugs you assigned to printers, with the broker user name and password. The reachability check sends nothing.
  - option: http_host
    ports: [80, 443]
    from: process
    why: Switches and reads a Tasmota or Shelly plug directly at the address you give that plug on the Plugs tab.
    sends: Status queries and relay commands for that plug, with its password when you set one.
  - option: ha_url
    ports: [8123, 80, 443]
    from: process
    why: Switches and reads plugs through the Home Assistant server you set on the Connections tab.
    sends: Your access token, state queries, and turn-on and turn-off calls for the entities you assigned to printers.

platforms:
  - linux_amd64
  - linux_arm64
  - darwin_amd64
  - darwin_arm64
  - windows_amd64

ui:
  entry: ui/index.js
  library: ">=0.0.1 <1.0.0"
  contributes:
    pages:
      - path: power
        title: Power Control
        icon: chart-line
    device_section:
      - id: power-plug
        title: Power Control
    device_card:
      - id: power-status
        title: Power
    settings:
      - id: plugs
        title: Plugs
      - id: connections
        title: Connections
      - id: automation
        title: Automation
    cards:
      - id: power
        title: Printer power
        description: What your printers draw now and over the last minutes, and which plugs are on.
        icon: chart-line
        size: {w: 4, h: 4}
        least: {w: 2, h: 2}
        settings:
          # Nothing picked shows every printer that has a plug, so the card
          # needs no setting up on a server with one printer.
          - key: printers
            kind: printers
            label: Printers
          - key: graph
            kind: switch
            label: Show the graph
            default: true
          - key: minutes
            kind: choice
            label: Span
            options:
              - {value: "5", label: 5 minutes}
              - {value: "15", label: 15 minutes}
              - {value: "30", label: 30 minutes}
              - {value: "60", label: 1 hour}
            default: "15"
