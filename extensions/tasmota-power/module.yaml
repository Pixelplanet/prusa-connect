name: tasmota-power
title: Tasmota Power Control
summary: Control and monitor Tasmota smart plugs for printers via MQTT (external or built-in broker) or Direct HTTP, with active-print power-off protection and auto-off after print.
codeowner: Pixelplanet
kind: sink
version: 0.4.1
license: MIT
contract_major: 1
openapi: openapi.json

require:
  core: ">=0.1.0-beta.1"
  core-device.get: "*"
  core-device.list: "*"
  core-device.jobs: "*"

permissions:
  - observe

needs:
  data: true

options:
  - key: mqtt_host
    type: string
    summary: Hostname or IP address of the MQTT broker.
  - key: http_host
    type: string
    summary: Hostname or IP address of a Tasmota smart plug controlled directly over HTTP.

egress:
  - option: mqtt_host
    ports: [1883, 8883]
    from: process
    why: Connects to the operator's MQTT broker to monitor and switch Tasmota smart plugs
    sends: Tasmota power commands and telemetry queries for assigned printer plugs
  - option: http_host
    ports: [80, 443]
    from: process
    why: Polls and switches a Tasmota smart plug directly over HTTP when no MQTT broker is used
    sends: Tasmota Status 0 queries and POWER relay commands to the plug's /cm endpoint

platforms:
  - linux_amd64
  - linux_arm64
  - darwin_amd64
  - darwin_arm64
  - windows_amd64

ui:
  entry: ui/index.js
  library: ">=0.0.1 <1.0.0"
  contributes:
    device_section:
      - id: power-plug
        title: Power Control
    device_card:
      - id: power-status
        title: Power
    settings:
      - id: settings
        title: Settings
