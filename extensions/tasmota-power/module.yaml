name: tasmota-power
title: Tasmota Power Control
summary: Control and monitor Tasmota smart plugs for printers via MQTT, with active-print power-off protection and auto-off after print.
codeowner: Pixelplanet
kind: sink
version: 0.3.0
license: MIT
contract_major: 1
openapi: openapi.json

require:
  core-device.get: "*"
  core-device.list: "*"
  core-device.jobs: "*"

permissions:
  - observe

needs:
  data: true

platforms:
  - linux_amd64
  - linux_arm64

ui:
  entry: ui/index.js
  library: ">=0.0.1 <1.0.0"
  contributes:
    device_section:
      - id: power-plug
        title: Power Control
    device_card:
      - id: power-status
        title: Power
    settings:
      - id: settings
        title: Settings
